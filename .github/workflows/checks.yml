name: Offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      docker:
        description: Run isolated Docker integration checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,ui,analysis]'
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m vericode demo --task clamp
  docker:
    if: github.event_name == 'workflow_dispatch' && inputs.docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev,ui,analysis]'
      - run: docker build --tag vericode-runner:day2 sandbox
      - run: python -m pytest --run-docker -q
